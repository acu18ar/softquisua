
{% extends "base.html" %}
{% block titulo %}Agregar proveedor{% endblock %}

{% block contenido %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h3 m-0">
        <i class="bi bi-truck"></i> Agregar proveedor
    </h1>

    <a href="{% url 'proveedores:inicio' %}" class="btn btn-outline-secondary">
        <i class="bi bi-arrow-left"></i> Volver
    </a>
</div>

<div class="card shadow-sm">
    <div class="card-body">
        {% if error %}
            <div class="alert alert-danger">{{ error }}</div>
        {% endif %}

        <form method="post">
            {% csrf_token %}

            <div class="mb-3">
                <label for="nombre" class="form-label">
                    Nombre o razón social *
                </label>
                <input
                    type="text"
                    id="nombre"
                    name="nombre"
                    class="form-control"
                    maxlength="150"
                    value="{{ nombre|default:'' }}"
                    required
                >
            </div>

            <div class="mb-3">
                <label for="telefono" class="form-label">Teléfono</label>
                <input
                    type="text"
                    id="telefono"
                    name="telefono"
                    class="form-control"
                    maxlength="30"
                    value="{{ telefono|default:'' }}"
                >
            </div>

            <button type="submit" class="btn btn-primary">
                <i class="bi bi-save"></i> Guardar proveedor
            </button>

            <a href="{% url 'proveedores:inicio' %}"
               class="btn btn-outline-secondary">
                Cancelar
            </a>
        </form>
    </div>
</div>
{% endblock %}
